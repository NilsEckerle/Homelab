# FoundryVTT at https://<host>/foundry/ behind Caddy (players use /foundry/join).
# Data (worlds, modules, licence, options) lives in /srv/data/foundry/data -> container /data.
# Image: felddy/foundryvtt downloads the pinned Foundry version with your account.
services:
  foundry:
    # Foundry version = image tag (build + ".0"). To update: back up, change the tag, push.
    # Worlds migrate one way, so never go back to an older tag after opening a world.
    image: felddy/foundryvtt:14.369
    hostname: foundry
    restart: unless-stopped
    networks:
      proxy:
        aliases: [foundry]
    environment:
      FOUNDRY_USERNAME: ${FOUNDRY_USERNAME:?}
      FOUNDRY_PASSWORD: ${FOUNDRY_PASSWORD:?}
      FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_KEY:-}
      FOUNDRY_PROXY_SSL: "true"
      FOUNDRY_PROXY_PORT: "443"
      FOUNDRY_ROUTE_PREFIX: foundry   # served at /foundry/ ; Caddy must NOT strip the prefix
      FOUNDRY_ADMIN_KEY: ${FOUNDRY_ADMIN_KEY:?set in secrets.enc.env}   # written to Config/admin.txt on every start
    volumes:
      - /srv/data/foundry/data:/data

networks:
  proxy:
    external: true
    name: proxy
