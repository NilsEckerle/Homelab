services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: homelab
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - /srv/data/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks: [tailnet]

networks:
  tailnet:
    name: tailnet
