# Synapse (Matrix) behind Caddy. Fully declarative: no manual commands needed.
# - "init" runs once per deploy: generates homeserver.yaml + signing key on first run,
#   then patches Postgres / public URL into it (scripts in ./init).
# - "create-admin" registers the admin user from secrets.enc.env (safe to re-run).
# Client/federation paths live at the domain root (/_matrix/*), see Caddyfile.
# Changing POSTGRES_PASSWORD later: re-run init (redeploy) AND change it inside postgres.
services:
  init:
    image: matrixdotorg/synapse:v1.164.1
    restart: "no"
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      SYNAPSE_SERVER_NAME: qyo7ixnxmemepulm.myfritz.net   # permanent, cannot change later
      SYNAPSE_REPORT_STATS: "no"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in secrets.enc.env}
    volumes:
      # - /srv/data/matrix/synapse:/data
      - /tmp/data3/matrix/synapse:/data
      - ./init:/init:ro

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: qyo7ixnxmemepulm.myfritz.net
    volumes:
      # - /srv/data/matrix/synapse:/data
      - /tmp/data3/matrix/synapse:/data
    networks:
      proxy:
        aliases: [synapse]
      internal:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in secrets.enc.env}
      POSTGRES_DB: synapse
      # Synapse requires C collation.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - /srv/data/matrix/postgres:/var/lib/postgresql/data
    networks:
      - internal

  create-admin:
    image: matrixdotorg/synapse:v1.164.1
    restart: "no"
    depends_on:
      - synapse
    entrypoint: ["/bin/sh", "/init/create-admin.sh"]
    environment:
      MATRIX_ADMIN_USER: ${MATRIX_ADMIN_USER:?set in secrets.enc.env}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD:?set in secrets.enc.env}
    volumes:
      # - /srv/data/matrix/synapse:/data:ro
      - /tmp/data3/matrix/synapse:/data:ro
      - ./init:/init:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
  internal:
