# Synapse (Matrix) behind Caddy. Config lives in git: homeserver.yaml (settings)
# plus a secrets.yaml rendered from secrets.enc.env. Needs Compose >= 2.23.1.
x-synapse: &synapse
  image: matrixdotorg/synapse:v1.164.1
  entrypoint: ["python", "-m", "synapse.app.homeserver",
               "-c", "/config/homeserver.yaml", "-c", "/config/secrets.yaml"]
  configs:
    - source: homeserver
      target: /config/homeserver.yaml
    - source: secrets
      target: /config/secrets.yaml
  volumes:
    - /srv/data/matrix/synapse:/data   # /tmp/data3/... while testing

services:
  keys:
    <<: *synapse
    restart: "no"
    command: ["--generate-keys"]   # only creates the signing key if missing

  synapse:
    <<: *synapse
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      proxy:
        aliases: [synapse]
      internal:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in secrets.enc.env}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - /srv/data/matrix/postgres:/var/lib/postgresql/data
    networks:
      - internal

  create-admin:
    image: matrixdotorg/synapse:v1.164.1
    restart: "no"
    depends_on:
      - synapse
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until python -c "import urllib.request as u; u.urlopen('http://synapse:8008/health')"; do sleep 2; done
        register_new_matrix_user -u "$$MATRIX_ADMIN_USER" -p "$$MATRIX_ADMIN_PASSWORD" -a \
          -k "$$SYNAPSE_REGISTRATION_SECRET" http://synapse:8008 || echo "admin exists or failed"
    environment:
      MATRIX_ADMIN_USER: ${MATRIX_ADMIN_USER:?}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD:?}
      SYNAPSE_REGISTRATION_SECRET: ${SYNAPSE_REGISTRATION_SECRET:?}
    networks:
      - proxy

configs:
  homeserver:
    file: ./homeserver.yaml
  secrets:
    content: |
      database:
        name: psycopg2
        args:
          user: synapse
          password: "${POSTGRES_PASSWORD}"
          database: synapse
          host: db
          cp_min: 5
          cp_max: 10
      registration_shared_secret: "${SYNAPSE_REGISTRATION_SECRET}"
      macaroon_secret_key: "${SYNAPSE_MACAROON_SECRET}"
      form_secret: "${SYNAPSE_FORM_SECRET}"

networks:
  proxy:
    external: true
    name: proxy
  internal:
