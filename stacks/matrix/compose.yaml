# Synapse (Matrix) behind Caddy. Config lives in git: homeserver.yaml (settings)
# plus a secrets.yaml rendered from secrets.enc.env. Needs Compose >= 2.23.1.
x-synapse: &synapse
  image: matrixdotorg/synapse:v1.164.1
  entrypoint: ["python", "-m", "synapse.app.homeserver",
               "-c", "/config/homeserver.yaml", "-c", "/config/secrets.yaml"]
  configs:
    - source: homeserver
      target: /config/homeserver.yaml
    - source: secrets
      target: /config/secrets.yaml
    - source: discord_registration
      target: /config/mautrix-discord-registration.yaml
  volumes:
    - /srv/data/matrix/synapse:/data

services:
  keys:
    <<: *synapse
    restart: "no"
    command: ["--generate-keys"]

  synapse:
    <<: *synapse
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      proxy:
        aliases: [synapse]
      internal:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in secrets.enc.env}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - /srv/data/matrix/postgres:/var/lib/postgresql/data
    networks:
      - internal

  create-admin:
    image: matrixdotorg/synapse:v1.164.1
    restart: "no"
    depends_on:
      - synapse
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until python -c "import urllib.request as u; u.urlopen('http://synapse:8008/health')"; do sleep 2; done
        register_new_matrix_user -u "$$MATRIX_ADMIN_USER" -p "$$MATRIX_ADMIN_PASSWORD" -a \
          -k "$$SYNAPSE_REGISTRATION_SECRET" http://synapse:8008 || echo "admin exists or failed"
    environment:
      MATRIX_ADMIN_USER: ${MATRIX_ADMIN_USER:?}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD:?}
      SYNAPSE_REGISTRATION_SECRET: ${SYNAPSE_REGISTRATION_SECRET:?}
    networks:
      - proxy

  mautrix-discord:
    image: dock.mau.dev/mautrix/discord:v0.7.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    configs:
      - source: discord_config
        target: /data/config.yaml
    networks:
      - internal

configs:
  homeserver:
    file: ./homeserver.yaml
  secrets:
    content: |
      database:
        name: psycopg2
        args:
          user: synapse
          password: "${POSTGRES_PASSWORD}"
          database: synapse
          host: db
          cp_min: 5
          cp_max: 10
      registration_shared_secret: "${SYNAPSE_REGISTRATION_SECRET}"
      macaroon_secret_key: "${SYNAPSE_MACAROON_SECRET}"
      form_secret: "${SYNAPSE_FORM_SECRET}"
  discord_config:
    content: |
      homeserver:
        address: http://synapse:8008
        domain: qyo7ixnxmemepulm.myfritz.net
      appservice:
        address: http://mautrix-discord:29334
        hostname: 0.0.0.0
        port: 29334
        id: discord
        as_token: "${DISCORD_AS_TOKEN}"
        hs_token: "${DISCORD_HS_TOKEN}"
        database:
          type: postgres
          uri: postgres://synapse:${POSTGRES_PASSWORD}@db/mautrix_discord?sslmode=disable
      bridge:
        permissions:
          "qyo7ixnxmemepulm.myfritz.net": user
          "@nils:qyo7ixnxmemepulm.myfritz.net": admin
  discord_registration:
    content: |
      id: discord
      url: http://mautrix-discord:29334
      as_token: "${DISCORD_AS_TOKEN}"
      hs_token: "${DISCORD_HS_TOKEN}"
      sender_localpart: discordbot
      rate_limited: false
      namespaces:
        users:
          - regex: "@discord_.*:qyo7ixnxmemepulm.myfritz.net"
            exclusive: true

networks:
  proxy:
    external: true
    name: proxy
  internal:
