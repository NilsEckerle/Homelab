services:
  dozzle:
    image: amir20/dozzle:v11.4.0-alpine
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_BASE: /dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/data/dozzle:/data
    networks:
      tailnet:
        aliases: [dozzle]

networks:
  tailnet:
    external: true
    name: tailnet
