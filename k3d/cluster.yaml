apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: homelab
servers: 1
agents: 2
kubeAPI:
  hostIP: "0.0.0.0"
  hostPort: "6550"
ports:
  - port: 80:80
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # traefik ships with k3s; drop it if you prefer ingress-nginx
      - arg: --disable=traefik
        nodeFilters:
          - server:*
